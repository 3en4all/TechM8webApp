<!-- 1. Biblioteka Supabase z CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Formularz HTML -->
<form id="contactForm" style="max-width: 500px; display: flex; flex-direction: column; gap: 10px;">
  <input type="text" id="name" placeholder="Twoje imię" required />
  <input type="email" id="email" placeholder="Twój e-mail" required />
  <input type="text" id="subject" placeholder="Temat wiadomości" required />
  <textarea id="message" placeholder="Treść wiadomości" rows="5" required></textarea>
  
  <button type="submit" id="submitBtn">Wyślij wiadomość</button>
  <p id="formStatus"></p>
</form>

<!-- 3. Skrypt obsługujący wysyłkę -->
<script>
  const SUPABASE_URL = 'https://yxhxrlmydbiblpninatx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_bp2Xrh7oGCwC55rj2JTGxQ_LmlAiabw'; // <-- Wklej tu swój anon key

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('contactForm');
  const statusText = document.getElementById('formStatus');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    submitBtn.disabled = true;
    statusText.style.color = 'black';
    statusText.innerText = 'Wysyłanie...';

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value
    };

    const { data, error } = await supabaseClient
      .from('contact_messages')
      .insert([payload]);

    if (error) {
      console.error('Błąd Supabase:', error);
      statusText.style.color = 'red';
      statusText.innerText = 'Błąd podczas wysyłania wiadomości. Spróbuj ponownie.';
    } else {
      statusText.style.color = 'green';
      statusText.innerText = 'Wiadomość została pomyślnie wysłana!';
      form.reset();
    }

    submitBtn.disabled = false;
  });
</script>
