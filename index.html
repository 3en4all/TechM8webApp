<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechM8 - Contact & Portfolio</title>
  <!-- CDN Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #formStatus {
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>TechM8 Console</h1>
    <p class="subtitle">Masz pytanie lub propozycję współpracy? Wyślij wiadomość.</p>

    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Imię / Nazwisko / Firma</label>
          <input type="text" id="name" placeholder="np. Jan Kowalski" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail kontaktowy</label>
          <input type="email" id="email" placeholder="jan@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="subject">Temat wiadomości</label>
        <input type="text" id="subject" placeholder="Określ temat zlecenia lub pytania" required>
      </div>

      <div class="form-group">
        <label for="message">Treść wiadomości</label>
        <textarea id="message" rows="5" placeholder="Wpisz tutaj szczegóły wiadomości..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">Wyślij wiadomość</button>
      <p id="formStatus"></p>
    </form>
  </div>

  <script>
  const SUPABASE_URL = 'https://yxhxrlmydbiblpninatx.supabase.co';
  const SUPABASE_ANON_KEY = 'TWOJ_KLUCZ_eyJ...'; // <-- Wklej swój pełny klucz anon (JWT)

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('contactForm');
  const statusText = document.getElementById('formStatus');
  const submitBtn = document.getElementById('submitBtn');

  const COOLDOWN_TIME_MS = 2 * 60 * 1000; // 2 minuty blokady po wysłaniu

  // Funkcja sprawdzająca czy użytkownik jest w trakcie odliczania
  function checkCooldown() {
    const lastSent = localStorage.getItem('last_contact_email_sent');
    if (lastSent) {
      const timePassed = Date.now() - parseInt(lastSent, 10);
      if (timePassed < COOLDOWN_TIME_MS) {
        const remainingSeconds = Math.ceil((COOLDOWN_TIME_MS - timePassed) / 1000);
        submitBtn.disabled = true;
        statusText.style.color = '#94a3b8';
        statusText.innerText = `Wiadomość wysłana. Kolejną możesz wysłać za ${remainingSeconds}s.`;
        return true;
      }
    }
    return false;
  }

  // Uruchomienie sprawdzania na starcie
  if (checkCooldown()) {
    const timer = setInterval(() => {
      if (!checkCooldown()) {
        clearInterval(timer);
        submitBtn.disabled = false;
        statusText.innerText = '';
      }
    }, 1000);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (checkCooldown()) return;
    
    submitBtn.disabled = true;
    statusText.style.color = '#94a3b8';
    statusText.innerText = 'Wysyłanie...';

    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      subject: document.getElementById('subject').value,
      message: document.getElementById('message').value
    };

    const { data, error } = await supabaseClient
      .from('contact_messages')
      .insert([payload]);

    if (error) {
      console.error('Błąd Supabase:', error);
      statusText.style.color = '#f87171';
      statusText.innerText = 'Błąd podczas wysyłania wiadomości. Spróbuj ponownie.';
      submitBtn.disabled = false;
    } else {
      // Zapisujemy czas wysyłki do localStorage
      localStorage.setItem('last_contact_email_sent', Date.now().toString());
      
      statusText.style.color = '#4ade80';
      statusText.innerText = 'Wiadomość została pomyślnie wysłana!';
      form.reset();

      // Włączamy odliczanie w czasie rzeczywistym
      const timer = setInterval(() => {
        if (!checkCooldown()) {
          clearInterval(timer);
          submitBtn.disabled = false;
          statusText.innerText = '';
        }
      }, 1000);
    }
  });
</script>

</body>
</html>
