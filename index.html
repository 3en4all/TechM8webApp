<!-- FILE: index.html -->
<!-- PURPOSE: Full CRUD Single Page Application frontend connected to Supabase -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Web App - Full CRUD Supabase Integration</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    form { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 30px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #0070f3; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
    button:hover { background: #0051a2; }
    button.btn-danger { background: #d93025; }
    button.btn-danger:hover { background: #a51d12; }
    button.btn-secondary { background: #5f6368; }
    button.btn-secondary:hover { background: #3c4043; }
    .post-card { border: 1px solid #eee; padding: 15px; border-radius: 6px; margin-bottom: 15px; background: #fff; }
    .post-card h3 { margin: 0 0 5px 0; color: #333; }
    .post-card p { margin: 0 0 10px 0; color: #666; }
    .actions { margin-top: 10px; }
    #status-msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Create New Post</h1>
  
  <form id="create-post-form">
    <div class="form-group">
      <label for="post-title">Title</label>
      <input type="text" id="post-title" required placeholder="Enter post title...">
    </div>
    <div class="form-group">
      <label for="post-content">Content</label>
      <textarea id="post-content" rows="4" required placeholder="Write post content..."></textarea>
    </div>
    <button type="submit" id="submit-btn">Publish Post</button>
    <div id="status-msg"></div>
  </form>

  <h2>Posts Feed</h2>
  <div id="posts">Loading...</div>

  <script>
    const SUPABASE_URL = 'https://yxhxrlmydbiblpninatx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bp2Xrh7oGCwC55rj2JTGxQ_LmlAiabw';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const postsContainer = document.getElementById('posts');
    const createForm = document.getElementById('create-post-form');
    const statusMsg = document.getElementById('status-msg');

    // 1. Fetch & Render Posts
    async function fetchPosts() {
      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        postsContainer.innerHTML = '<strong>Database Error:</strong> ' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        postsContainer.innerHTML = 'Connected successfully! No posts found in database.';
        return;
      }

      postsContainer.innerHTML = data
        .map(post => `
          <div class="post-card" id="post-${post.id}">
            <h3>${escapeHtml(post.title)}</h3>
            <p>${escapeHtml(post.content)}</p>
            <div class="actions">
              <button class="btn-secondary" onclick="editPost('${post.id}', '${escapeJs(post.title)}', '${escapeJs(post.content)}')">Edit</button>
              <button class="btn-danger" onclick="deletePost('${post.id}')">Delete</button>
            </div>
          </div>
        `)
        .join('');
    }

    // 2. Create Post (INSERT)
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const titleInput = document.getElementById('post-title');
      const contentInput = document.getElementById('post-content');
      
      statusMsg.style.color = '#333';
      statusMsg.textContent = 'Publishing...';

      const { error } = await supabaseClient
        .from('posts')
        .insert([{ title: titleInput.value.trim(), content: contentInput.value.trim() }]);

      if (error) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Failed to create post: ' + error.message;
        return;
      }

      statusMsg.style.color = 'green';
      statusMsg.textContent = 'Post published successfully!';
      titleInput.value = '';
      contentInput.value = '';
      fetchPosts();
    });

    // 3. Edit Post (UPDATE)
    async function editPost(id, currentTitle, currentContent) {
      const newTitle = prompt('Edit Post Title:', currentTitle);
      if (newTitle === null) return; // Cancelled

      const newContent = prompt('Edit Post Content:', currentContent);
      if (newContent === null) return; // Cancelled

      if (!newTitle.trim() || !newContent.trim()) {
        alert('Title and content cannot be empty.');
        return;
      }

      const { error } = await supabaseClient
        .from('posts')
        .update({ title: newTitle.trim(), content: newContent.trim() })
        .eq('id', id);

      if (error) {
        alert('Failed to update post: ' + error.message);
        return;
      }

      fetchPosts();
    }

    // 4. Delete Post (DELETE)
    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post?')) return;

      const { error } = await supabaseClient
        .from('posts')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Failed to delete post: ' + error.message);
        return;
      }

      fetchPosts();
    }

    // Helper utilities for escaping strings
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ');
    }

    fetchPosts();
  </script>
</body>
</html>
